
<!-- EDIT DOKUMEN -->
<section class="edit-doc-container">
    <div class="edit-doc-header">
        <div class="edit-doc-icon">📝</div>
        <div>
            <h2>Edit Dokumen</h2>
            <p>Tambah dokumen baru atau ubah daftar dokumen.</p>
        </div>
    </div>

    <form id="editDocumentForm">
        <div class="edit-doc-field">
            <label for="documentName">Nama dokumen</label>
            <input
                type="text"
                id="documentName"
                placeholder="Contoh: Analisis Sistem.pdf"
                required
            >
        </div>

        <div class="edit-doc-field">
            <label for="documentDescription">Keterangan</label>
            <textarea
                id="documentDescription"
                placeholder="Keterangan singkat dokumen"
                rows="4"
            ></textarea>
        </div>

        <div class="edit-doc-field">
            <label>Unggah file dokumen</label>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">☁</div>
                <h3>Pilih file dari komputer Anda</h3>
                <p>PDF, DOCX, PPTX · Maks. 10 MB</p>

                <label for="documentFile" class="choose-file-button">
                    ▯ &nbsp; Pilih File
                </label>

                <input
                    type="file"
                    id="documentFile"
                    accept=".pdf,.docx,.pptx"
                    hidden
                >
            </div>

            <div class="selected-file" id="selectedFile" hidden>
                <div class="file-icon" id="fileIcon">📄</div>

                <div class="file-details">
                    <strong id="fileName"></strong>
                    <span id="fileSize"></span>
                </div>

                <button
                    type="button"
                    class="remove-file-button"
                    id="removeFile"
                    aria-label="Hapus pilihan file"
                >×</button>
            </div>
        </div>

        <div class="edit-doc-actions">
            <button type="submit" class="add-document-button">
                ＋ &nbsp; Tambah Dokumen
            </button>

            <button
                type="button"
                class="cancel-document-button"
                id="cancelDocument"
            >Batal</button>
        </div>
    </form>
</section>

<style>
.edit-doc-container {
    box-sizing: border-box;
    width: 100%;
    padding: 26px;
    background: #fff;
    border: 1px solid #e2eaf5;
    border-radius: 12px;
    color: #17385f;
    font-family: Arial, sans-serif;
}

.edit-doc-container * {
    box-sizing: border-box;
}

.edit-doc-header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding-bottom: 24px;
    margin-bottom: 22px;
    border-bottom: 1px solid #e5edf7;
}

.edit-doc-icon {
    font-size: 32px;
}

.edit-doc-header h2 {
    margin: 0 0 8px;
    font-size: 25px;
}

.edit-doc-header p {
    margin: 0;
    color: #7185a4;
    font-size: 15px;
}

.edit-doc-field {
    margin-bottom: 26px;
}

.edit-doc-field > label {
    display: block;
    margin-bottom: 10px;
    font-weight: 700;
    font-size: 15px;
}

.edit-doc-field input[type="text"],
.edit-doc-field textarea {
    display: block;
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #cfdbec;
    border-radius: 9px;
    outline: none;
    font: inherit;
    font-size: 15px;
    color: #17385f;
    background: #fff;
}

.edit-doc-field input[type="text"]:focus,
.edit-doc-field textarea:focus {
    border-color: #2878ed;
    box-shadow: 0 0 0 3px #2878ed18;
}

.edit-doc-field textarea {
    min-height: 108px;
    resize: vertical;
}

.upload-area {
    min-height: 208px;
    padding: 22px;
    border: 2px dashed #b8d2ff;
    border-radius: 10px;
    background: #f9fbff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: background .2s, border-color .2s;
}

.upload-area.drag-over {
    background: #eaf3ff;
    border-color: #1769e8;
}

.upload-icon {
    color: #2878ed;
    font-size: 43px;
    line-height: 1.2;
    margin-bottom: 8px;
}

.upload-area h3 {
    margin: 0 0 8px;
    font-size: 16px;
}

.upload-area p {
    margin: 0 0 17px;
    color: #7185a4;
    font-size: 13px;
}

.choose-file-button {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    min-width: 158px;
    padding: 14px 24px;
    margin: 0 !important;
    border-radius: 9px;
    background: #1769e8;
    color: white;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
}

.choose-file-button:hover,
.add-document-button:hover {
    background: #1058cc;
}

.selected-file {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 14px 17px;
    margin-top: 13px;
    border: 1px solid #e0ebfa;
    border-radius: 10px;
    background: #f5f9ff;
}

.file-icon {
    font-size: 30px;
}

.file-details {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
}

.file-details strong {
    overflow-wrap: anywhere;
    font-size: 14px;
}

.file-details span {
    color: #7185a4;
    font-size: 12px;
}

.remove-file-button {
    width: 35px;
    height: 35px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: #edf1f7;
    color: #29496d;
    font-size: 23px;
    cursor: pointer;
}

.edit-doc-actions {
    display: flex;
    gap: 14px;
    margin-top: 35px;
}

.add-document-button,
.cancel-document-button {
    flex: 1;
    min-height: 43px;
    padding: 12px 16px;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    cursor: pointer;
}

.add-document-button {
    background: #1769e8;
    color: white;
    font-weight: 600;
}

.cancel-document-button {
    background: #eaf1fd;
    color: #244b80;
}

.cancel-document-button:hover {
    background: #dce8fb;
}

@media (max-width: 600px) {
    .edit-doc-container {
        padding: 17px;
    }

    .edit-doc-header h2 {
        font-size: 21px;
    }

    .edit-doc-actions {
        flex-direction: column;
    }
}
</style>

<script>
(function () {
    const form = document.getElementById("editDocumentForm");
    const fileInput = document.getElementById("documentFile");
    const selectedFile = document.getElementById("selectedFile");
    const fileName = document.getElementById("fileName");
    const fileSize = document.getElementById("fileSize");
    const fileIcon = document.getElementById("fileIcon");
    const uploadArea = document.getElementById("uploadArea");
    const removeFile = document.getElementById("removeFile");
    const cancelButton = document.getElementById("cancelDocument");

    if (!form || !fileInput) return;

    let currentFile = null;
    const maxSize = 10 * 1024 * 1024;
    const allowedTypes = ["pdf", "docx", "pptx"];

    function formatSize(bytes) {
        return bytes >= 1024 * 1024
            ? (bytes / (1024 * 1024)).toFixed(1) + " MB"
            : Math.max(1, Math.round(bytes / 1024)) + " KB";
    }

    function showFile(file) {
        if (!file) return;

        const extension = file.name.split(".").pop().toLowerCase();

        if (!allowedTypes.includes(extension)) {
            alert("Format file harus PDF, DOCX, atau PPTX.");
            fileInput.value = "";
            return;
        }

        if (file.size > maxSize) {
            alert("Ukuran file maksimal 10 MB.");
            fileInput.value = "";
            return;
        }

        currentFile = file;
        fileName.textContent = file.name;
        fileSize.textContent = formatSize(file.size);
        fileIcon.textContent = extension === "pdf" ? "📕" : "📄";
        selectedFile.hidden = false;
    }

    function clearFile() {
        currentFile = null;
        fileInput.value = "";
        selectedFile.hidden = true;
    }

    fileInput.addEventListener("change", function () {
        showFile(fileInput.files[0]);
    });

    removeFile.addEventListener("click", clearFile);

    uploadArea.addEventListener("dragover", function (event) {
        event.preventDefault();
        uploadArea.classList.add("drag-over");
    });

    uploadArea.addEventListener("dragleave", function () {
        uploadArea.classList.remove("drag-over");
    });

    uploadArea.addEventListener("drop", function (event) {
        event.preventDefault();
        uploadArea.classList.remove("drag-over");

        const file = event.dataTransfer.files[0];
        if (!file) return;

        const transfer = new DataTransfer();
        transfer.items.add(file);
        fileInput.files = transfer.files;
        showFile(file);
    });

    cancelButton.addEventListener("click", function () {
        form.reset();
        clearFile();
    });

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const name = document.getElementById("documentName").value.trim();
        const description = document
            .getElementById("documentDescription").value.trim();

        if (!name) {
            alert("Nama dokumen harus diisi.");
            return;
        }

        if (!currentFile) {
            alert("Silakan pilih file dokumen terlebih dahulu.");
            return;
        }

        /*
          TITIK INTEGRASI:
          Hubungkan currentFile, name, dan description ke
          backend Google Drive yang memverifikasi admin.

          Jangan menganggap file sudah tersimpan hanya karena
          berhasil dipilih di komputer.
        */

        alert(
            "Validasi berhasil.\n\n" +
            "Nama: " + name + "\n" +
            "File: " + currentFile.name +
            "\n\nFile belum diunggah ke Google Drive. " +
            "Hubungkan form ini ke backend terlebih dahulu."
        );
    });
})();
</script>
